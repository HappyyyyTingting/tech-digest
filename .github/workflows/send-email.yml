name: Send digest email

on:
  push:
    branches: [main]
    paths:
      - "digests/*.md"
  workflow_dispatch:
    inputs:
      file:
        description: "可选：指定日报路径，例如 digests/2026-10-23.md；留空则使用最新一份"
        required: false
        type: string
      dry_run:
        description: "只渲染预览，不发送邮件"
        required: false
        type: boolean
        default: false
      audio_only:
        description: "只生成语音和站点，不发送邮件（补历史音频时用）"
        required: false
        type: boolean
        default: false

# 同一天多次推送时排队执行，避免两封邮件同时发出。
concurrency:
  group: digest-email
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整历史，才能用 push 事件的 before..after 找出本次改动的日报。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve digest files
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail

          files=()

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_FILE}" ]; then
              files+=("${INPUT_FILE}")
            else
              latest="$(find digests -maxdepth 1 -type f -name '*.md' ! -name '_TEMPLATE.md' | sort | tail -n 1)"
              if [ -n "${latest}" ]; then
                files+=("${latest}")
              fi
            fi
          else
            if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "${AFTER_SHA}")"
            else
              base="${BEFORE_SHA}"
            fi
            while IFS= read -r file; do
              files+=("${file}")
            done < <(git diff --name-only "${base}" "${AFTER_SHA}" -- 'digests/*.md' | grep -v '_TEMPLATE.md' || true)
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "本次没有发现新增或修改的日报，跳过发送。"
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "list<<DIGEST_FILES"
            printf '%s\n' "${files[@]}"
            echo "DIGEST_FILES"
          } >> "$GITHUB_OUTPUT"
          printf '待处理：%s\n' "${files[@]}"

      # 语音是可选功能：这一步失败不会阻止邮件发送。
      - name: Generate and upload audio
        if: steps.files.outputs.list != ''
        id: audio
        continue-on-error: true
        env:
          FILES: ${{ steps.files.outputs.list }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AUDIO_BASE_URL: ${{ secrets.AUDIO_BASE_URL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_RATE: ${{ vars.TTS_RATE }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            python scripts/make_audio.py --file "${file}" --out-dir audio --upload
          done <<< "${FILES}"

      - name: Build audio site
        if: steps.files.outputs.list != ''
        id: site
        continue-on-error: true
        env:
          AUDIO_BASE_URL: ${{ secrets.AUDIO_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_site.py --audio-dir audio --site-dir site

      - name: Upload Pages artifact
        if: steps.files.outputs.list != '' && steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.files.outputs.list != '' && steps.site.outcome == 'success'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Render and send
        if: steps.files.outputs.list != '' && inputs.audio_only != true
        env:
          FILES: ${{ steps.files.outputs.list }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          SITE_URL: ${{ vars.SITE_URL }}
          PODCAST_FEED_URL: ${{ vars.PODCAST_FEED_URL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
        run: |
          set -euo pipefail

          podcast_url=""
          if [ "${DEPLOY_OUTCOME}" = "success" ]; then
            podcast_url="${PODCAST_FEED_URL:-}"
            if [ -z "${podcast_url}" ] && [ -n "${SITE_URL:-}" ]; then
              podcast_url="${SITE_URL%/}/feed.xml"
            fi
            if [ -z "${podcast_url}" ] && [ -n "${GITHUB_REPOSITORY:-}" ]; then
              owner="${GITHUB_REPOSITORY%%/*}"
              repo="${GITHUB_REPOSITORY#*/}"
              podcast_url="https://${owner,,}.github.io/${repo}/feed.xml"
            fi
          fi

          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            date="$(basename "${file}" .md)"
            meta="audio/${date}.json"
            audio_url=""
            audio_duration=""
            if [ -f "${meta}" ]; then
              audio_url="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("url") or "")' "${meta}")"
              audio_duration="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(int(float(d.get("duration") or 0)))' "${meta}")"
            fi

            args=(--file "${file}")
            if [ -n "${audio_url}" ]; then
              args+=(--audio-url "${audio_url}")
            fi
            if [ -n "${audio_duration}" ] && [ "${audio_duration}" != "0" ]; then
              args+=(--audio-duration "${audio_duration}")
            fi
            if [ -n "${podcast_url}" ]; then
              args+=(--podcast-url "${podcast_url}")
            fi

            echo "处理：${file}"
            if [ "${DRY_RUN}" = "true" ]; then
              python scripts/send_email.py "${args[@]}" --dry-run --out-dir artifacts
            else
              python scripts/send_email.py "${args[@]}"
            fi
          done <<< "${FILES}"

      - name: Upload preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: email-preview
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
